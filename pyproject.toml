[project]
name = "zonic-mcp-server"
version = "2.0.0"
description = "Zonic MCP server — FastAPI. One MCP tool, `execute`, runs database, API and function tools in a single round-trip."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # MCP transport (official SDK, protocol only). Pinned to 1.x: mcp 2.0 removed the
    # low-level Server.list_tools() / call_tool() decorators app/mcp_server/server.py uses.
    "mcp>=1.28,<2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # api executor, cache client and config API client
    "httpx>=0.27",
    # database executor (MSSQL)
    "pyodbc>=5.1",
    # nested config access in the read-through cache
    "pydash>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # Starlette's TestClient runs the app lifespan in one task, as the MCP session manager
    # requires; it now recommends httpx2, which this project does not depend on.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
